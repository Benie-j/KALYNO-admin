
name: KALYNO Platform API checks

on:
  pull_request:
    paths:
      - "supabase/functions/kalyno-platform-api/**"
      - "docs/openapi.yaml"
      - ".github/workflows/platform-api-check.yml"

  push:
    paths:
      - "supabase/functions/kalyno-platform-api/**"
      - "docs/openapi.yaml"
      - ".github/workflows/platform-api-check.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate Platform API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check API TypeScript
        run: deno check supabase/functions/kalyno-platform-api/index.ts

      - name: Run API contract tests
        run: deno test supabase/functions/kalyno-platform-api/contract_test.ts
